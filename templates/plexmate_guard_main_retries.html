{% extends "base.html" %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('plexmate_guard.static', filename='css/plexmate_guard.css') }}">
<script>var PLEXMATE_GUARD_PACKAGE = 'plexmate_guard';</script>
<script src="{{ url_for('plexmate_guard.static', filename='js/plexmate_guard.js') }}"></script>
<div class="guard-toolbar"><button id="retry_refresh" class="btn btn-sm btn-secondary">새로고침</button><span class="guard-muted">정체 중 기록된 후보입니다. 안정화된 뒤 한 건씩만 갱신하세요. 요청이 시간 초과되면 Plex가 계속 처리 중일 수 있으므로 즉시 다시 누르지 마세요.</span></div>
<div class="guard-section"><div id="retry_list"></div></div>
<script>
function loadRetries() { guardAjax('main', 'retries', {}, function(ret) {
  var root = $('#retry_list').empty(), rows = ret.data || [];
  if (!rows.length) root.text('기록된 metadata 재시도 후보가 없습니다.');
  rows.forEach(function(item) { var row = $('<div class="guard-retry"></div>');
    row.append($('<strong></strong>').text('ratingKey ' + item.rating_key + ' · ' + item.status));
    row.append($('<div class="guard-sub"></div>').text(item.agent || '-'));
    row.append($('<div class="guard-path"></div>').text(item.media_path || '-'));
    if (item.status === 'pending') { var b = $('<button class="btn btn-sm btn-primary">metadata 갱신 요청</button>'); b.click(function(){ if(confirm('이 항목만 Plex metadata 갱신을 요청할까요?')) guardAjax('main','retry_refresh',{id:item.id},loadRetries); }); row.append(b); }
    root.append(row); });
}); }
$('#retry_refresh').click(function(e){e.preventDefault();loadRetries();}); $(document).ready(loadRetries);
</script>
{% endblock %}
